<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Formulário de IDV & Logo | KGestão de Marcas</title>
  <meta name="description" content="Formulário estratégico para projetos de identidade visual, logotipo, rebranding e embalagens de alto valor. Direção criativa por Kleber Oliveira.">

  <!-- Favicon / Monograma K Oficial (Preto) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='595 415 250 245'%3E%3Cpolygon fill='%23111111' points='600.16,485.66 600.16,570.57 665.38,485.66'/%3E%3Cpolygon fill='%23111111' points='600.16,655.47 665.38,570.57 600.16,570.57'/%3E%3Cpolygon fill='%23111111' points='774.25,422.05 665.38,570.57 708.85,570.57 774.09,655.47 839.31,655.47 773.99,570.57 730.61,570.57 839.31,422.05'/%3E%3C/svg%3E">

  <!-- Google Fonts: Inter + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS Unificado do Sistema -->
  <link rel="stylesheet" href="assets/css/style.css">

  <script>
    (function() {
      const savedTheme = localStorage.getItem("kgestao_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
    })();
  </script>
</head>
<body class="briefing-body">

  <!-- Top Bar de Navegação Mobile-First -->
  <header class="briefing-app-header">
    <a href="index.html" class="briefing-back-link" title="Retornar à página principal">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span data-i18n="back_to_home">Voltar ao Início</span>
    </a>

    <!-- Marca Oficial KGestão -->
    <a href="index.html" class="header-logo" title="KGestão de Marcas">
      <img src="logo/logo-oficial/logo-01.svg" alt="KGestão de Marcas" class="header-logo-img logo-light" style="height: 32px;">
      <img src="logo/logo-oficial/logo-02.svg" alt="KGestão de Marcas" class="header-logo-img logo-dark" style="height: 32px;">
    </a>

    <div class="top-controls">
      <!-- Seletor de Idioma em Cápsula com Bandeiras -->
      <div class="lang-capsule" role="group" aria-label="Seletor de idioma">
        <button type="button" class="lang-capsule-btn active" id="lang-pt" title="Português">
          <span class="flag-badge">
            <svg class="flag-icon" viewBox="0 0 20 14" width="18" height="13" aria-hidden="true">
              <rect width="20" height="14" rx="2.5" fill="#009c3b"/>
              <polygon points="10,1.8 18.2,7 10,12.2 1.8,7" fill="#ffdf00"/>
              <circle cx="10" cy="7" r="3.2" fill="#002776"/>
              <path d="M 7.1 7.4 A 3.2 3.2 0 0 0 13.0 6.2" stroke="#ffffff" stroke-width="0.75" fill="none" stroke-linecap="round"/>
            </svg>
          </span>
          <span>PT</span>
        </button>
        <button type="button" class="lang-capsule-btn" id="lang-en" title="English">
          <span class="flag-badge">
            <svg class="flag-icon" viewBox="0 0 20 14" width="18" height="13" aria-hidden="true">
              <clipPath id="us-clip-briefing"><rect width="20" height="14" rx="2.5"/></clipPath>
              <g clip-path="url(#us-clip-briefing)">
                <rect width="20" height="14" fill="#ffffff"/>
                <rect y="0" width="20" height="1.08" fill="#bf0a30"/>
                <rect y="2.15" width="20" height="1.08" fill="#bf0a30"/>
                <rect y="4.31" width="20" height="1.08" fill="#bf0a30"/>
                <rect y="6.46" width="20" height="1.08" fill="#bf0a30"/>
                <rect y="8.62" width="20" height="1.08" fill="#bf0a30"/>
                <rect y="10.77" width="20" height="1.08" fill="#bf0a30"/>
                <rect y="12.92" width="20" height="1.08" fill="#bf0a30"/>
                <rect width="9" height="7.54" fill="#002868"/>
                <circle cx="2" cy="1.6" r="0.6" fill="#ffffff"/>
                <circle cx="4.5" cy="1.6" r="0.6" fill="#ffffff"/>
                <circle cx="7" cy="1.6" r="0.6" fill="#ffffff"/>
                <circle cx="3.25" cy="3.2" r="0.6" fill="#ffffff"/>
                <circle cx="5.75" cy="3.2" r="0.6" fill="#ffffff"/>
                <circle cx="2" cy="4.8" r="0.6" fill="#ffffff"/>
                <circle cx="4.5" cy="4.8" r="0.6" fill="#ffffff"/>
                <circle cx="7" cy="4.8" r="0.6" fill="#ffffff"/>
                <circle cx="3.25" cy="6.4" r="0.6" fill="#ffffff"/>
                <circle cx="5.75" cy="6.4" r="0.6" fill="#ffffff"/>
              </g>
            </svg>
          </span>
          <span>EN</span>
        </button>
      </div>

      <!-- Alternador de Tema -->
      <button type="button" class="btn-icon-top" id="theme-toggle" title="Alternar tema claro/escuro" aria-label="Alternar tema">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Container Principal do Briefing (Renderizado via briefing.js) -->
  <main class="briefing-page-container">
    <div class="briefing-panel-card" id="briefing-app">
      <!-- O fluxo dinâmico em 5 etapas é renderizado aqui -->
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/briefing.js"></script>

  <!-- Lógica de Alternância de Tema -->
  <script>
    const themeBtn = document.getElementById("theme-toggle");
    function syncThemeToggleIcon(theme) {
      if (!themeBtn) return;
      if (theme === "dark") {
        themeBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        themeBtn.title = "Mudar para modo Off-white";
        themeBtn.setAttribute("aria-label", "Mudar para modo Off-white");
      } else {
        themeBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
        themeBtn.title = "Mudar para modo escuro";
        themeBtn.setAttribute("aria-label", "Mudar para modo escuro");
      }
    }

    if (themeBtn) {
      syncThemeToggleIcon(document.documentElement.getAttribute("data-theme") || "light");
      themeBtn.onclick = () => {
        const cur = document.documentElement.getAttribute("data-theme") || "light";
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("kgestao_theme", next);
        syncThemeToggleIcon(next);
      };
    }
  </script>
</body>
</html>
